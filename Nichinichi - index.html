<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nichinichi</title>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: una colonna stretta; in alto Hari (il riccio) che parla, sotto serie, alfabeti e lezione.
   Colore: arancione vivo come marchio, giallo sole e crema calda come sfondo; ogni alfabeto ha il suo colore (hiragana arancio, katakana turchese, kanji viola); verde/rosso solo per giusto/sbagliato.
   Tipo: Figtree per l'interfaccia, Noto Sans JP (gothic standard, senza grazie) per tutto il giapponese. */
:root{
  --bg:#FFF2D3; --surface:#FFFFFF; --ink:#2B1505; --muted:#8A5A38; --line:#FFD99C; --dots:#FFE3AE;
  --accent:#F25C00; --accent-deep:#B84300; --accent-ink:#FFFFFF;
  --soft:linear-gradient(135deg,#FFF0BF 0%,#FFD38F 100%); --accent-soft:linear-gradient(135deg,#FFF0BF 0%,#FFD38F 100%);
  --good:#0E8F47; --good-deep:#096B34; --good-soft:#D6F7E3; --bad:#E0344B; --bad-deep:#A81F33; --bad-soft:#FFE0E5;
  --flame:#FF8A00; --sun:#FFC400;
  --h-hira:#F25C00; --h-kata:#0AAE9E; --h-kanji:#7A4DF5;
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-jp:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  --f-glyph:var(--f-jp);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1109; --surface:#2E1B0D; --ink:#FFF0DC; --muted:#E0B08A; --line:#5C3A1C; --dots:#2A1A0D;
    --accent:#FF8A24; --accent-deep:#B85A06; --accent-ink:#1E1109;
    --soft:linear-gradient(135deg,#46290F 0%,#63390F 100%); --accent-soft:linear-gradient(135deg,#46290F 0%,#63390F 100%);
    --good:#35D487; --good-deep:#1E9A5C; --good-soft:#12382A; --bad:#FF6377; --bad-deep:#C4364A; --bad-soft:#44191F;
    --flame:#FFA033; --sun:#FFD23D;
    --h-hira:#FF8A24; --h-kata:#2DD4C4; --h-kanji:#A98BFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1109; --surface:#2E1B0D; --ink:#FFF0DC; --muted:#E0B08A; --line:#5C3A1C; --dots:#2A1A0D;
  --accent:#FF8A24; --accent-deep:#B85A06; --accent-ink:#1E1109;
  --soft:linear-gradient(135deg,#46290F 0%,#63390F 100%); --accent-soft:linear-gradient(135deg,#46290F 0%,#63390F 100%);
  --good:#35D487; --good-deep:#1E9A5C; --good-soft:#12382A; --bad:#FF6377; --bad-deep:#C4364A; --bad-soft:#44191F;
  --flame:#FFA033; --sun:#FFD23D;
  --h-hira:#FF8A24; --h-kata:#2DD4C4; --h-kanji:#A98BFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:16px; line-height:1.45;
  padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto}
.jp{font-family:var(--f-jp)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:20px;letter-spacing:.01em}
.brand-jp{font-family:var(--f-glyph);font-size:24px;color:var(--accent)}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.flame{color:var(--flame)}
.flame.off{color:var(--line)}

.tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px;padding:4px;background:var(--soft);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:9px 4px;font-size:14px;white-space:nowrap;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 2px 0;font-weight:700}

.streak{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.streak-n{font-size:46px;line-height:1;font-weight:700;display:flex;align-items:center;gap:8px}
.streak-n svg{width:38px;height:38px}
.streak-l{color:var(--muted);margin-top:4px;min-width:0}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.dot.done{background:var(--accent);border-color:var(--accent)}
.dot.today{border-color:var(--accent)}
.dot.future{opacity:.5}
.goalrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.alpha{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ab{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);min-width:0}
.ab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ab .g{font-family:var(--f-glyph);font-size:34px;line-height:1;font-weight:700}
.ab .n{font-weight:700;font-size:14px}
.ab .s{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.hint{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line)}
.btn.small{padding:10px 14px;font-size:15px;width:auto;display:inline-block}
.btn-sub{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}

/* Lesson */
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{border:0;background:transparent;width:38px;height:38px;border-radius:10px;font-size:26px;line-height:1;color:var(--muted)}
.lhead .bar{height:12px}
.lcount{font-weight:700;color:var(--muted);font-size:14px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.qlab{font-size:20px;font-weight:700;margin:0 0 14px;text-wrap:balance}
.glyph{font-family:var(--f-glyph);font-size:112px;line-height:1.05;text-align:center;font-weight:500;margin:12px 0 26px}
.word{font-family:var(--f-jp);font-size:56px;line-height:1.15;text-align:center;font-weight:700;margin:16px 0 26px;overflow-wrap:anywhere}
.word.long{font-size:40px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:170px}
.opt{min-height:68px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:600;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px}
.opt.jpo{font-family:var(--f-jp);font-size:28px;font-weight:700}
.opt.jpo.ph{font-size:20px;line-height:1.3}
.opt small{display:block;font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.phrase{font-family:var(--f-jp);font-size:30px;line-height:1.3;text-align:center;font-weight:700;margin:14px 0 4px;overflow-wrap:anywhere}
.rom{text-align:center;color:var(--muted);margin-bottom:22px}
.intro .phrase{margin:18px 0 6px}
.opt kbd{font:600 12px var(--f-ui);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opts.locked .opt{cursor:default}
.intro{text-align:center;padding:22px 16px}
.intro .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.intro .glyph{font-size:132px;margin:14px 0 6px}
.intro .rd{font-size:26px;font-weight:700}
.intro .mean{font-size:19px;margin-top:6px}
.intro .tip{color:var(--muted);margin:10px auto 18px;max-width:34ch}
.say.big{padding:18px 30px;font-size:18px;border-radius:16px}
.say{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--accent);border-radius:12px;padding:7px 12px;font-weight:700;font-size:14px}

.fb{position:fixed;left:0;right:0;bottom:0;z-index:5;border-top:2px solid var(--line);background:var(--surface);
  padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb-t{font-weight:700;font-size:19px}
.fb.good .fb-t{color:var(--good)}
.fb.bad .fb-t{color:var(--bad)}
.fb-d{font-size:15px;min-width:0;overflow-wrap:anywhere}
.fb-d .jp-d{font-family:var(--f-jp);font-size:20px;font-weight:700}
.fb .btn{background:var(--accent)}
.fb.good .btn{background:var(--good);color:#fff}
.fb.bad .btn{background:var(--bad);color:#fff}
.fb-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}

/* Result */
.rhead{text-align:center;padding:10px 0 4px}
.rhead h1{font-size:28px;margin:6px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{text-align:center;padding:14px 8px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wl{display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wr:first-child{border-top:0}
.wr .w{font-family:var(--f-jp);font-size:22px;font-weight:700;overflow-wrap:anywhere}
.wr .w small{display:block;font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--muted)}
.wr .t{text-align:right;font-weight:600;overflow-wrap:anywhere}
.wr .m{grid-column:1 / -1;display:flex;gap:3px}
.pip{width:14px;height:5px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--accent)}

/* Library */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cell{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--soft);min-width:0}
.stat{background:var(--soft)}
.cell.off{opacity:.35}
.cell .c{font-family:var(--f-glyph);font-size:28px;line-height:1.1;font-weight:700}
.cell .r{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .m{display:flex;gap:2px;justify-content:center;margin-top:4px}
.cell .pip{width:8px;height:4px}
.empty{color:var(--muted);padding:6px 2px}
.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:380px){
  .glyph{font-size:92px}
  .opt{font-size:16px}
  .opt.jpo{font-size:24px}
  .ab .g{font-size:28px}
}
@media (prefers-reduced-motion: reduce){ .bar>i{transition:none} }

/* ---- Look giocoso: sfondo a puntini, tasti "in rilievo", alfabeti colorati ---- */
body{background-image:radial-gradient(var(--dots) 1.6px,transparent 1.7px);background-size:22px 22px}
.brand{align-items:center}
.card{box-shadow:0 3px 0 var(--line)}
.btn{border-radius:16px;box-shadow:0 4px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.fb .btn{color:var(--accent-ink)}
.fb.good .btn{background:var(--good);color:var(--accent-ink);box-shadow:0 4px 0 var(--good-deep)}
.fb.bad .btn{background:var(--bad);color:var(--accent-ink);box-shadow:0 4px 0 var(--bad-deep)}
.tabs button[aria-selected="true"]{box-shadow:0 3px 0 var(--accent-deep)}
.opt{box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.opts:not(.locked) .opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.correct{box-shadow:0 3px 0 var(--good)}
.opt.wrong{box-shadow:0 3px 0 var(--bad)}
.ab{box-shadow:0 3px 0 var(--line)}
.ab[data-al="hira"]{--h:var(--h-hira)}
.ab[data-al="kata"]{--h:var(--h-kata)}
.ab[data-al="kanji"]{--h:var(--h-kanji)}
.ab .g{color:var(--h)}
.ab .bar>i{background:var(--h)}
.ab[aria-pressed="true"]{border-color:var(--h);background:color-mix(in srgb,var(--h) 14%,var(--surface));box-shadow:0 3px 0 var(--h)}

/* ---- Hari, il riccio ---- */
.mrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mrow.hero{margin-bottom:0}
.mw{flex:none;display:block;width:76px;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:16px}
.mw.sm{width:46px}
.mw.big{width:112px}
.bub{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.bub::before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bub .qlab{margin:0;font-size:18px}
.mascot{display:block;width:100%;height:auto;overflow:visible}
.mascot .mv{transform-box:fill-box;transform-origin:50% 100%;animation:mBob 2.8s ease-in-out infinite}
.mascot .quills{transform-box:fill-box;transform-origin:50% 90%;animation:mQuill 3.2s ease-in-out infinite}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:mBlink 4.6s infinite}
.mascot .eye-h,.mascot .mouth-o,.mascot .mouth-s,.mascot .tear,.mascot .brow{display:none}
.mascot .arm{transform-box:fill-box;transform-origin:50% 12%;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.mascot .spk{opacity:0;fill:var(--sun);transform-box:fill-box;transform-origin:center}
@keyframes mBob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-1.5px) scale(1.015,.985)}}
@keyframes mQuill{0%,100%{transform:rotate(0)}50%{transform:rotate(1.8deg)}}
@keyframes mBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes mJump{0%{transform:translateY(0) scale(1.07,.93)}35%{transform:translateY(-13px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0) scale(1,1)}}
@keyframes mSad{0%,100%{transform:translateY(2px) rotate(-2deg)}50%{transform:translateY(3px) rotate(2deg)}}
@keyframes mSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.8)}100%{transform:rotate(360deg) scale(1)}}
@keyframes mWave{from{transform:rotate(-115deg)}to{transform:rotate(-155deg)}}
@keyframes mTwinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.15)}}
.m-happy .eye,.m-cheer .eye{display:none}
.m-happy .eye-h,.m-cheer .eye-h{display:inline}
.m-happy .mouth-d,.m-cheer .mouth-d{display:none}
.m-happy .mouth-o,.m-cheer .mouth-o{display:inline}
.m-sad .mouth-d{display:none}
.m-sad .mouth-s,.m-sad .tear,.m-sad .brow{display:inline}
.m-happy .mv{animation:mJump .7s ease-out 1}
.m-cheer .mv{animation:mJump .8s ease-out infinite}
.m-sad .mv{animation:mSad 2.4s ease-in-out infinite}
.m-poke .mv{transform-origin:50% 62%;animation:mSpin .7s cubic-bezier(.3,.7,.3,1) 1}
.m-happy .arm.l{transform:rotate(40deg)}
.m-happy .arm.r{transform:rotate(-40deg)}
.m-cheer .arm.l{transform:translate(-6px,-6px) rotate(145deg)}
.m-cheer .arm.r{transform:translate(6px,-6px) rotate(-145deg)}
.m-wave .arm.r{animation:mWave .7s ease-in-out infinite alternate}
.m-happy .spk,.m-cheer .spk{animation:mTwinkle 1s ease-in-out infinite}
.m-happy .s2,.m-cheer .s2{animation-delay:.3s}
.m-happy .s3,.m-cheer .s3{animation-delay:.6s}
@media (prefers-reduced-motion: reduce){ .mascot *{animation:none!important;transition:none!important} }
.lvh{font-size:13px;color:var(--accent);margin:16px 2px 8px;font-weight:700;letter-spacing:.06em}
details.cat>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none;padding:12px 14px;background:var(--surface);border:2px solid var(--line);border-radius:14px;font-weight:700;box-shadow:0 3px 0 var(--line)}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details.cat .wl{margin-top:10px}
.cnt{color:var(--muted);font-size:14px}
.mt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mc{min-height:64px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.mc.jp{font-family:var(--f-jp);font-size:26px}
.mc.jp.sm{font-size:19px}
.mc.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.mc.ok{border-color:var(--good);background:var(--good-soft);box-shadow:none;opacity:.6}
.mc.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);animation:mShake .3s}
@keyframes mShake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bpad{height:170px}
.typ{display:flex;flex-direction:column;gap:12px}
.tin{font:600 22px var(--f-ui);width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.tin:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tin.ok{border-color:var(--good);background:var(--good-soft)}
.tin.no{border-color:var(--bad);background:var(--bad-soft)}
.btn:disabled{opacity:.45;box-shadow:0 4px 0 var(--line);cursor:default}
.skip{border:0;background:transparent;color:var(--muted);font-weight:600;padding:10px;text-decoration:underline}
.bq{font-size:22px;font-weight:700;text-align:center;margin:6px 0 16px;text-wrap:balance}
.ans{min-height:68px;padding:10px 4px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:16px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.tile{padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--line)}
.tile.used{opacity:.25;box-shadow:none}
.ans.good .tile{border-color:var(--good)}
.ans.bad .tile{border-color:var(--bad)}
@media (prefers-reduced-motion: reduce){ .mc.no{animation:none} }

/* SRS, flashcard, particelle */
.srs{display:flex;flex-direction:column;gap:12px}
.srs-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.srs-n{font-size:46px;line-height:1;font-weight:700;color:var(--accent)}
.srs-l{font-size:14px;color:var(--muted);font-weight:600}
.srs-side{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);text-align:right}
.srs-side b{color:var(--ink)}
.srs-h{margin:0}
.fc{text-align:center;padding:20px 16px}
.fc .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:99px}
.fc .glyph{font-size:112px;margin:10px 0 6px}
.fc .word{margin:12px 0 6px}
.fc .phrase{margin:14px 0 6px}
.fc-q{color:var(--muted);font-weight:600;margin-top:6px}
.fc-back{border-top:2px dashed var(--line);margin-top:14px;padding-top:14px}
.fc-m{font-size:24px;font-weight:700}
.fc-r{font-size:17px;margin-top:4px;font-family:var(--f-jp);font-weight:600}
.fc-r span{font-family:var(--f-ui);color:var(--muted);font-weight:500}
.fc-ex{margin-top:8px;color:var(--muted);font-size:15px}
.fc-ex .jp{color:var(--ink);font-weight:700;font-size:18px}
.rates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 4px;font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.rate small{font-size:12px;font-weight:600;color:var(--muted)}
.rate:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.rate.r0{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.rate.r2{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.rate.r3{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.rate.r1{border-color:var(--sun);box-shadow:0 3px 0 var(--sun)}
.pns{margin:10px 0 2px;display:flex;flex-direction:column;gap:4px}
.pn{font-size:14px;color:var(--muted);text-align:left;background:var(--accent-soft);border-radius:10px;padding:6px 10px;overflow-wrap:anywhere}
.fb .pns{margin:0}
.fb .pn{background:transparent;padding:0;color:inherit;opacity:.85}
.pn b{color:var(--ink);font-size:17px}
mark{background:var(--sun);color:#2B1505;border-radius:5px;padding:0 3px;font-weight:700}
details.pt .pk{font-size:24px;color:var(--accent)}
details.pt .pn2{color:var(--muted);font-weight:600;font-size:14px}
.pc{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.pr{margin:0;font-weight:600}
.pe{border-top:1px solid var(--line);padding-top:10px}
.pj{font-family:var(--f-jp);font-size:22px;font-weight:700;overflow-wrap:anywhere}
.pm{font-size:14px;color:var(--muted)}
.pm mark{color:#2B1505}
.pi{font-weight:600;margin-top:2px}
.pb{margin:0;font-size:14px;color:var(--muted)}
.pqc{text-align:center;padding:20px 14px}
.pqc .phrase{margin:6px 0 10px}
.blank{display:inline-block;width:1.1em;height:.14em;margin:0 .1em;background:var(--accent);border-radius:99px;vertical-align:baseline}
.pq-it{font-size:18px}
.pqo{padding-bottom:0}
.pqfb{display:flex;flex-direction:column;gap:6px;text-align:left}
.pqfb.good{border-color:var(--good);background:var(--good-soft)}
.pqfb.bad{border-color:var(--bad);background:var(--bad-soft)}
.pqfb.good .fb-t{color:var(--good)}
.pqfb.bad .fb-t{color:var(--bad)}
@media (max-width:380px){ .rate{font-size:13px} .srs-n{font-size:40px} }

.n5q .hint{margin-bottom:6px}
.n5q .phrase{font-size:26px;margin:4px 0 2px}
.pqo .opt{font-size:18px}
.pqo .opt.jpo{font-size:24px}

.tabs::-webkit-scrollbar{display:none}
.top{min-width:0}.brand{min-width:0}
@media (max-width:430px){ #hdrM:not([hidden])~.brand-n{display:none} }

.spk{display:inline-block;vertical-align:middle;border:0;background:transparent;font-size:15px;line-height:1;padding:3px 6px;margin-left:2px;border-radius:8px;opacity:.55;cursor:pointer;font-family:var(--f-ui)}
.spk:hover,.spk:focus-visible{opacity:1;background:var(--accent-soft)}
.spk:active{transform:scale(.92)}
.phrase .spk,.n5q .spk{font-size:17px}
/* ---- Percorso a tappe (Caratteri) ---- */
[data-psal="hira"]{--h:var(--h-hira)} [data-psal="kata"]{--h:var(--h-kata)} [data-psal="kanji"]{--h:var(--h-kanji)}
.pmap{display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px}
.prail{display:flex;flex-direction:column;align-items:center}
.pnd{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;border:3px solid var(--line);background:var(--surface);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.pln{flex:1;width:5px;min-height:16px;margin:6px 0;border-radius:3px;background:var(--line)}
.stp:last-child .pln{display:none}
.stp.done .pnd{background:var(--good);border-color:var(--good-deep);color:var(--accent-ink);box-shadow:0 4px 0 var(--good-deep)}
.stp.done .pln{background:var(--good)}
.stp.cur .pnd{background:var(--h);border-color:var(--h);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--h) 60%,#000);animation:ptPulse 1.8s ease-in-out infinite}
.stp.lock .pnd{opacity:.6}
@keyframes ptPulse{50%{transform:scale(1.07)}}
.ptc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;width:100%;min-width:0;margin-bottom:12px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 3px 0 var(--line)}
.stp.cur .ptc{border-color:var(--h);background:color-mix(in srgb,var(--h) 12%,var(--surface));box-shadow:0 3px 0 var(--h)}
.stp.done .ptc{border-color:var(--good)}
.stp.lock .ptc{opacity:.6;cursor:default}
.ptc .tt{font-weight:700}.ptc .tg{font-size:24px;font-weight:700;letter-spacing:.1em;line-height:1.25;overflow-wrap:anywhere}.ptc .ts{font-size:13px;color:var(--muted);font-weight:600}
.mnem{margin:12px auto 4px;max-width:36ch;text-align:left;background:var(--accent-soft);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.4}
.mnem b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.exs{margin:10px 0 0;font-size:15px;color:var(--muted)}.exs .jp{color:var(--ink);font-weight:700;font-size:20px}
.pips{display:flex;gap:6px;justify-content:center;margin:14px 0 16px}.pips .pip{width:26px;height:6px}
@media (prefers-reduced-motion: reduce){ .stp.cur .pnd{animation:none} .combo{transition:none} }
.combo{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);opacity:0;z-index:20;pointer-events:none;background:var(--sun);color:#2B1505;font-weight:700;padding:7px 16px;border-radius:99px;border:2px solid var(--flame);box-shadow:0 3px 0 var(--flame);white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.combo.on{transform:translate(-50%,0);opacity:1}
.rtag{display:inline-block;margin:-8px 0 12px;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;border:1px solid var(--line)}
</style>

/* ---------- costruzione lezione ---------- */
var L=null;
function gate(a){
  /* Nuovi caratteri solo se tutti quelli già visti di questo alfabeto sono consolidati. */
  return ITEMS[a].filter(function(x){ return S.learned[x.id]&&!solid(x); }).length===0;
}
function pickNew(){
  var sels=ALPHS.filter(function(a){ return S.sel[a]; });
  var cap=sels.length>1?4:3, per={hira:3,kata:3,kanji:2}, out=[], cnt={}, queue={};
  sels.forEach(function(a){ cnt[a]=0; queue[a]=nextUnlearned(a,per[a]); });
  var added=true;
  while(out.length<cap&&added){
    added=false;
    sels.forEach(function(a){
      if(out.length<cap&&cnt[a]<per[a]&&queue[a].length&&gate(a)){ out.push(queue[a].shift()); cnt[a]++; added=true; }
    });
  }
  return out;
}
function weighted(list,avoid){
  var c=list;
  if(avoid&&list.length>1) c=list.filter(function(x){ return x.id!==avoid; });
  var now=Date.now();
  var ws=c.map(function(x){
    var s=S.items[x.id], m=s?s.m:0, seen=s?s.seen:0, due=0;
    if(s&&s.due){ var od=(now-s.due)/864e5; if(od>0) due=Math.min(16,4+od*3); }
    return Math.pow(6-m,2)+(seen===0?8:0)+(solid(x)?0:12)+due;
  });
  var tot=ws.reduce(function(a,b){ return a+b; },0), r=Math.random()*tot;
  for(var i=0;i<c.length;i++){ r-=ws[i]; if(r<=0) return c[i]; }
  return c[c.length-1];
}
function mkQ(it){
  var m=mast(it), alt=(m>=2&&Math.random()<0.5);
  if(audioOn()&&m>=1&&Math.random()<0.25) return {t:'q',item:it,type:'listen'};
  if(it.kind==='p'){
    if(it.rom.split(' ').length>=3&&Math.random()<0.4) return {t:'q',item:it,type:'bld'};
    return {t:'q',item:it,type:alt?'it2p':'p2it'};
  }
  if(S.typing!==false&&m>=1&&canType(it)&&Math.random()<(it.kind==='w'?0.15:0.2)) return {t:'q',item:it,type:'typ'};
  if(it.kind==='w') return {t:'q',item:it,type:alt?'it2w':'w2it'};

}
function buildPhraseLesson(){
  var known=PL.filter(isIntro), fresh=PL.filter(function(x){ return !isIntro(x); });
  var gate=known.filter(function(x){ return !solid(x); }).length===0;
  var nw=gate?fresh.slice(0,3):[], intro=[];
  nw.forEach(function(it){ intro.push({t:'intro',item:it}); intro.push({t:'q',item:it,type:'p2it'}); });
  var pool=known.concat(nw);
  var unc=known.filter(function(x){ return !solid(x); }).sort(function(a,b){ return stOf(a)-stOf(b); }).slice(0,Math.max(0,5-nw.length));
  builtTargets=nw.concat(unc);
  var T=Math.min(12,Math.max(8,pool.length*3));
  var R=Math.max(0,T-2*nw.length), review=[], last=nw.length?nw[nw.length-1].id:null;
  for(var i=0;i<R;i++){ var it=weighted(pool,last); review.push(mkQ(it)); last=it.id; }
  nw.forEach(function(it,j){ review.splice(Math.min(review.length,2+j*3),0,{t:'q',item:it,type:'it2p'}); });

}
function startPhraseLesson(){ comboReset();

  show('lesson'); renderStep();
}
var builtTargets=[];
function buildLesson(){
  var nw=pickNew(), intro=[];
  nw.forEach(function(it){ intro.push({t:'intro',item:it}); intro.push({t:'q',item:it,type:'read'}); });
  var chars=[];
  ALPHS.forEach(function(a){ if(S.sel[a]) ITEMS[a].forEach(function(it){ if(S.learned[it.id]||nw.indexOf(it)>=0) chars.push(it); }); });
  var unc=chars.filter(function(x){ return !solid(x)&&nw.indexOf(x)<0; }).sort(function(a,b){ return stOf(a)-stOf(b); }).slice(0,Math.max(0,4-nw.length));
  builtTargets=nw.concat(unc);
  var words=eligibleWords(), useWords=words.length>=4;
  var T=Math.min(12,Math.max(8,chars.length*3));
  var R=Math.max(0,T-2*nw.length), review=[], last=nw.length?nw[nw.length-1].id:null;
  var known=words.filter(isIntro), fresh=words.filter(function(w){ return !isIntro(w); }).sort(function(a,b){ return a.w.length-b.w.length; }), newW=0;
  for(var i=0;i<R;i++){
    var it;
    if(useWords&&Math.random()<0.4){
      if(fresh.length&&newW<3&&(Math.random()<0.6||!known.length)){
        it=fresh.splice(Math.floor(Math.random()*Math.min(6,fresh.length)),1)[0]; newW++;
        known.push(it); builtTargets.push(it);
        review.push({t:'intro',item:it}); review.push({t:'q',item:it,type:'w2it'}); last=it.id;
        continue;

    review.push(mkQ(it)); last=it.id;
  }
  nw.forEach(function(it,j){
    var pos=Math.min(review.length,2+j*3);
    while(pos>0&&pos<review.length&&review[pos-1].t==='intro') pos++;
    review.splice(pos,0,{t:'q',item:it,type:'glyph'});

}

/* ---------- domande ---------- */
function disp(type,x){
  if(type==='listen') return x.kind==='c'?x.ch:x.it;
  if(type==='it2p') return x.w;
  if(type==='glyph'||type==='it2w') return x.kind==='w'?x.w:x.ch;
  if(type==='w2it'||type==='p2it') return x.it;
  return x.al==='kanji'?x.it:x.rom;
}
function distractors(it,type){
  var out=[], seen={}, pools=[]; seen[disp(type,it)]=1;
  if(it.kind==='c'){
    var same=ITEMS[it.al].filter(function(x){ return x.id!==it.id; });
    pools.push(shuffle(same.filter(function(x){ return S.learned[x.id]; })));
    pools.push(shuffle(same));
  } else if(it.kind==='p'){
    var ps=PL.filter(function(x){ return x.id!==it.id; });
    pools.push(shuffle(ps.filter(isIntro)));
    pools.push(shuffle(ps));
  } else {
    var ws=WL.filter(function(x){ return x.al===it.al&&x.id!==it.id; });
    pools.push(shuffle(ws.filter(isIntro)));
    pools.push(shuffle(ws.filter(learnedWord)));
    pools.push(shuffle(ws));
  }
  pools.forEach(function(p){ p.forEach(function(x){
    if(out.length<3){ var d=disp(type,x); if(!seen[d]){ seen[d]=1; out.push(x); } }
  }); });
  return out;
}
function qCount(){ return L.steps.filter(function(s){ return s.t==='q'||s.t==='m'; }).length; }
function openTargets(){ return L.targets.filter(function(it){ return !solid(it); }); }
function progress(){
  var q=qCount(), base=q?L.done/q:0;
  if(!L.targets.length) return Math.min(1,base);
  var tot=0; L.targets.forEach(function(it){ tot+=Math.min(stOf(it),need(it))/need(it); });
  return Math.min(1,0.5*base+0.5*tot/L.targets.length);
}
/* Quando le domande previste finiscono ma qualcosa non è ancora sicuro, continua. */
function more(){
  var open=openTargets();
  if(!open.length||L.extra>=30) return false;
  var last=L.steps[L.steps.length-1], batch=shuffle(open).slice(0,4);
  if(batch.length>1&&last&&last.item&&batch[0].id===last.item.id){ batch.push(batch.shift()); }
  batch.forEach(function(it){
    var alt=(L.extra%2===1), t;
    if(it.kind==='p') t=alt?'it2p':'p2it'; else if(it.kind==='w') t=alt?'it2w':'w2it'; else t=alt?'glyph':'read';
    if(audioOn()&&L.extra%5===4&&mast(it)>=1) t='listen';
    L.steps.push({t:'q',item:it,type:t}); L.extra++;
  });
  return true;
}

function plainType(it){ return it.kind==='p'?'p2it':(it.kind==='w'?'w2it':'read'); }
function canType(it){ return /^[a-z]+$/.test(it.rom||'')&&(it.kind==='c'?(it.al==='hira'||it.al==='kata'):(it.al==='h'||it.al==='k')); }
/* Confronto del romaji: accetta le grafie alternative più comuni (si/shi, tu/tsu, ou/oo/ō...). */
function normRom(t){
  t=(t||'').toLowerCase().replace(/[\s'’\-.,!?]/g,'').replace(/ō/g,'oo').replace(/ū/g,'uu').replace(/ā/g,'aa').replace(/ē/g,'ee').replace(/ī/g,'ii');

/* Registra una risposta. opt: {capSt:true} = non può rendere "solido" l'elemento (coppie), {xp:n}, {retryType:'...'} */

  }

function renderBld(st){

  extra=shuffle(pool).slice(0,Math.min(2,pool.length));
  var tiles=shuffle(toks.concat(extra)).map(function(t){ return {t:t,u:false}; });

function paintBld(){

function tapTile(kind,i){
  var c=L.cur; if(!c||!c.bld||c.locked) return;
  if(kind==='b'){ if(c.tiles[i]&&!c.tiles[i].u){ c.tiles[i].u=true; c.ans.push(i); } }
  else { var ti=c.ans[i]; if(ti!==undefined){ c.tiles[ti].u=false; c.ans.splice(i,1); } }

function checkBld(){

/* --- Tocca le coppie --- */
function mLabel(it){ return (it.kind==='w'||it.al==='kanji')?it.it:it.rom; }
function mFace(it){ return it.kind==='w'?it.w:it.ch; }
function pickMatchItems(pool,n){
  var out=[], labs={}, faces={}, left=pool.slice(), guard=0;
  while(out.length<n&&left.length&&guard++<120){
    var x=weighted(left,null); left=left.filter(function(y){ return y.id!==x.id; });
    var lb=mLabel(x), fc=mFace(x);
    if(labs[lb]||faces[fc]) continue;
    labs[lb]=1; faces[fc]=1; out.push(x);
  }
  return out.length===n?out:null;
}
function addMatch(review,chars,words,nw){
  if(Math.random()>0.85) return;
  function seen(x){ var s=S.items[x.id]; return !!(s&&s.seen>0); }
  var cp=chars.filter(function(x){ return nw.indexOf(x)<0&&seen(x); }), wp=words.filter(seen);
  var pool=(wp.length>=5&&(cp.length<5||Math.random()<0.5))?wp:cp;
  var its=pickMatchItems(pool,5); if(!its) return;
  var pos=Math.min(review.length,3);
  while(pos>0&&pos<review.length&&review[pos-1].t==='intro') pos++;
  review.splice(pos,0,{t:'m',items:its});
}
function renderMatch(st){
  var ids=st.items.map(function(x){ return x.id; }), left=shuffle(ids), right=shuffle(ids);
  L.cur={step:st,match:true,locked:false,selL:null,selR:null,done:0,miss:{},total:ids.length,busy:false};
  var h=headHTML()+mrow('Tocca le coppie','idle')+'<div class="mt"><div class="mcol">';
  left.forEach(function(id){ var x=BYID[id]; h+='<button type="button" class="mc jp'+((x.kind==='w'&&x.w.length>3)?' sm':'')+'" data-mc="1" data-side="L" data-id="'+id+'">'+mFace(x)+'</button>'; });
  h+='</div><div class="mcol">';
  right.forEach(function(id){ var x=BYID[id]; h+='<button type="button" class="mc" data-mc="1" data-side="R" data-id="'+id+'">'+mLabel(x)+'</button>'; });
  h+='</div></div><div class="bpad"></div>';
  $('lesson').innerHTML=h; hideFb();
}
function matchTap(b){
  var c=L.cur; if(!c||!c.match||c.busy||c.locked||b.disabled) return;
  var side=b.getAttribute('data-side'), id=b.getAttribute('data-id'), key=(side==='L')?'selL':'selR';
  if(c[key]===b){ b.classList.remove('sel'); c[key]=null; return; }
  if(c[key]) c[key].classList.remove('sel');
  c[key]=b; b.classList.add('sel');
  if(side==='L'&&audioOn()){ var xi=BYID[id]; if(xi) speak(speakText(xi)); }
  if(!(c.selL&&c.selR)) return;
  var a=c.selL, r=c.selR, ok=(a.getAttribute('data-id')===r.getAttribute('data-id'));
  var msv=document.querySelector('#lesson .mascot');
  if(ok){
    a.classList.remove('sel'); r.classList.remove('sel'); a.classList.add('ok'); r.classList.add('ok'); a.disabled=true; r.disabled=true;
    c.selL=null; c.selR=null; c.done++; moodOf(msv,'happy',900);
    if(c.done>=c.total) finishMatch();
  } else {
    c.miss[a.getAttribute('data-id')]=1; c.busy=true;
    a.classList.add('no'); r.classList.add('no'); moodOf(msv,'sad',700);
    setTimeout(function(){ a.classList.remove('no'); a.classList.remove('sel'); r.classList.remove('no'); r.classList.remove('sel'); c.selL=null; c.selR=null; c.busy=false; },550);
  }
}
function finishMatch(){
  var c=L.cur; c.locked=true;

    +'<button type="button" class="btn" id="cont">'+(lastStep?'Termina':'Continua')+'</button></div>';

/* ---------- SRS: ripasso a intervalli ---------- */
/* Gradi: 0 Ancora, 1 Difficile, 2 Bene, 3 Facile. Funzione pura: restituisce il nuovo stato di pianificazione. */
function srsNext(s,g,now){
  var ez=s.ez||2.3, reps=s.reps||0, ivl=s.ivl||0, lap=s.lapses||0, due;
  if(g===0){
    if(reps>0) lap++;
    reps=0; ivl=0; ez=Math.max(1.3,ez-0.2); due=now+10*60e3;
  } else {
    if(g===1) ez-=0.15; else if(g===3) ez+=0.15;
    ez=Math.min(3,Math.max(1.3,ez));
    if(reps===0) ivl=[0,0.5,1,3][g];
    else if(reps===1) ivl=[0,2,3,6][g];
    else ivl=Math.max(ivl+1,ivl*[0,1.2,ez,ez*1.3][g]);
    ivl=Math.min(540,ivl); reps++; due=now+ivl*864e5;
  }
  return {due:due,ivl:ivl,ez:ez,reps:reps,lapses:lap};
}
/* Applica un voto. Una risposta giusta data troppo presto (scadenza lontana) non allunga l'intervallo, salvo force. */
function srsReview(it,g,force){
  var s=S.items[it.id]; if(!s) return;
  var now=Date.now();
  if(g>0&&!force&&s.due&&s.due>now+6*36e5) return;
  var r=srsNext(s,g,now);
  s.due=r.due; s.ivl=r.ivl; s.ez=r.ez; s.reps=r.reps; s.lapses=r.lapses;
}
function dueList(){
  var now=Date.now(), a=[];
  Object.keys(S.items).forEach(function(k){ var s=S.items[k]; if(s&&s.seen>0&&s.due&&s.due<=now&&BYID[k]) a.push(BYID[k]); });
  a.sort(function(x,y){ return S.items[x.id].due-S.items[y.id].due; });
  return a;
}
function fmtIvl(d){
  if(d<1/24) return Math.max(1,Math.round(d*1440))+' min';
  if(d<1) return Math.round(d*24)+' ore';
  if(d<30) return Math.round(d)+' g';
  if(d<365){ var m=Math.round(d/30); return m+(m===1?' mese':' mesi'); }
  return (Math.round(d/36.5)/10).toString().replace('.',',')+' anni';
}
function fmtWhen(ms){
  var d=(ms-Date.now())/864e5;
  if(d<1/24) return 'tra pochi minuti';
  if(d<1) return 'tra '+Math.round(d*24)+' ore';
  if(d<2) return 'domani';
  return 'tra '+Math.round(d)+' giorni';
}
function srsStats(){
  var now=Date.now(), r={due:0,d1:0,d7:0,tot:0,sol:0,next:0};
  Object.keys(S.items).forEach(function(k){
    var s=S.items[k]; if(!s||!s.seen||!s.due||!BYID[k]) return;
    r.tot++; if(s.ivl>=21) r.sol++;
    if(s.due<=now) r.due++;
    else { if(s.due<=now+864e5) r.d1++; else if(s.due<=now+7*864e5) r.d7++; if(!r.next||s.due<r.next) r.next=s.due; }
  });
  return r;
}
function srsCard(){
  var st=srsStats(), n=Math.min(st.due,20), msg;
  if(st.due) msg='Ti ripropongo ciò che sta per sfuggirti. Più rispondi bene, più gli intervalli si allungano.';
  else if(st.tot) msg='Tutto in ordine, la memoria riposa. Prossimo ripasso '+fmtWhen(st.next)+'.';
  else msg='Dopo la prima lezione qui compaiono i ripassi, al momento giusto.';
  return '<div class="card srs"><div class="srs-top"><div><div class="srs-n num">'+st.due+'</div><div class="srs-l">da ripassare ora</div></div>'
    +'<div class="srs-side"><span><b class="num">'+st.d1+'</b> entro 24 ore</span><span><b class="num">'+st.d7+'</b> entro 7 giorni</span><span><b class="num">'+st.sol+'</b> a lungo termine</span></div></div>'
    +'<p class="hint srs-h">'+msg+'</p>'
    +(st.due?'<button type="button" class="btn" id="go-r">Ripassa ora<span class="btn-sub">'+n+(n===1?' carta':' carte')+' · circa '+Math.max(1,Math.round(n*0.15))+' min</span></button>':'')
    +'<button type="button" class="btn ghost small" data-go="part">Particelle: wa, ga, o, ni…</button></div>';
}

function rateCard(g){
  if(!R||!R.flip||g<0||g>3) return;

}

   +'<h2 class="sec">Hai studiato</h2><div class="grid">'+g.items.map(function(x){ return '<div class="cell"><div class="c">'+x.ch+'</div><div class="r">'+(K?x.it:x.rom)+'</div></div>'; }).join('')+'</div>'
   +(nx?'<button type="button" class="btn" data-ptgrp="'+nx.id+'">Prossima tappa<span class="btn-sub">'+nx.title+'</span></button>':'')+'<button type="button" class="btn ghost" id="pt-map">Torna alla mappa</button>';
  PT=null;
}
function ptQuit(){ PT=null; hideFb(); renderLib(); show('lib'); }
document.addEventListener('keydown',function(e){
  if(!PT||view!=='lesson') return; var onB=e.target&&e.target.tagName==='BUTTON';
  if(PT.phase==='quiz'){ if(!PT.locked&&e.key>='1'&&e.key<='4') ptPick(parseInt(e.key,10)-1); else if(PT.locked&&e.key==='Enter'&&!onB){ e.preventDefault(); ptNext(); } }
  else if(PT.phase==='study'&&e.key==='Enter'&&!onB){ e.preventDefault(); ptNext(); }
});

/* ---------- eventi ---------- */
document.addEventListener('click',function(e){
  var t=e.target, b=t.closest?t.closest('button'):null; if(!b) return;
  if(b.hasAttribute('data-mascot')){
    moodOf(b.querySelector('.mascot'),'poke',800);
    var bb=(b.parentNode&&b.parentNode.querySelector)?b.parentNode.querySelector('.bub[data-quip]'):null;
    if(bb){ bb.textContent=QUIPS[Math.floor(Math.random()*QUIPS.length)]; }
    return;
  }
  if(b.hasAttribute('data-tab')){ var v=b.getAttribute('data-tab'); if(v==='home') renderHome(); else if(v==='words') renderWords(); else if(v==='phr') renderPhr(); else if(v==='n5') renderN5Menu(); else renderLib(); show(v); return; }
  if(b.hasAttribute('data-ptsec')){ pst().sec=b.getAttribute('data-ptsec'); save(); renderLib(); return; }
  if(b.hasAttribute('data-ptgrp')){ ptStart(b.getAttribute('data-ptgrp')); return; }
  if(b.hasAttribute('data-ptopt')){ ptPick(parseInt(b.getAttribute('data-ptopt'),10)); return; }
  if(b.hasAttribute('data-ptm')){ ptMatchTap(b); return; }
  if(b.id==='pt-next'){ ptNext(); return; }
  if(b.id==='pt-back'){ if(PT&&PT.si>0){ PT.si--; ptStudy(); } return; }
  if(b.id==='pt-quit'){ ptQuit(); return; }
  if(b.id==='pt-map'){ renderLib(); show('lib'); return; }
  if(b.hasAttribute('data-n5cat')){ startN5(b.getAttribute('data-n5cat')); return; }
  if(b.hasAttribute('data-n5')){ n5Pick(parseInt(b.getAttribute('data-n5'),10)); return; }
  if(b.id==='n5-next'){ n5Next(); return; }
  if(b.id==='n5-menu'||b.id==='n5-quit'){ renderN5Menu(); show('n5'); return; }
  if(b.hasAttribute('data-go')){ if(b.getAttribute('data-go')==='part'){ renderPart(); show('part'); } return; }
  if(b.id==='go-r'||b.id==='again-r'){ startReview(); return; }
  if(b.id==='rflip'){ flipCard(); return; }
  if(b.hasAttribute('data-rate')){ rateCard(parseInt(b.getAttribute('data-rate'),10)); return; }
  if(b.id==='rquit'){ save(); renderHome(); show('home'); return; }
  if(b.id==='go-pq'){ startPQ(); return; }
  if(b.hasAttribute('data-pq')){ pqPick(parseInt(b.getAttribute('data-pq'),10)); return; }
  if(b.id==='pq-next'){ pqNext(); return; }
  if(b.id==='pq-quit'){ renderPart(); show('part'); return; }
  if(b.hasAttribute('data-wf')){ wFilter=b.getAttribute('data-wf'); wLimit=60; renderWords(); return; }
  if(b.id==='wmore'){ wLimit+=60; renderWords(); return; }
  if(b.hasAttribute('data-goal')){ S.goal=parseInt(b.getAttribute('data-goal'),10); save(); renderHome(); renderSettings(); return; }
  if(b.hasAttribute('data-al')){
    var a=b.getAttribute('data-al'), now=!S.sel[a], cnt=ALPHS.filter(function(x){ return S.sel[x]; }).length;
    if(!now&&cnt<=1) return;
    S.sel[a]=now; save(); renderHome(); return;
  }
  if(b.hasAttribute('data-audio')){ setAudio(b.getAttribute('data-audio')==='1'); renderHome(); renderSettings(); return; }
  if(b.id==='audioBtn'){ setAudio(!audioOn()); return; }
  if(b.hasAttribute('data-sayj')){ speak(b.getAttribute('data-sayj')); return; }
  if(b.hasAttribute('data-say')){ var it=BYID[b.getAttribute('data-say')]; if(it) speak(speakText(it)); return; }
  if(b.hasAttribute('data-i')){ pick(parseInt(b.getAttribute('data-i'),10)); return; }
  if(b.hasAttribute('data-mc')){ matchTap(b); return; }
  if(b.hasAttribute('data-tb')){ tapTile('b',parseInt(b.getAttribute('data-tb'),10)); return; }
  if(b.hasAttribute('data-ta')){ tapTile('a',parseInt(b.getAttribute('data-ta'),10)); return; }
  if(b.id==='chk'){ if(L&&L.cur){ if(L.cur.bld) checkBld(); else if(L.cur.typ) submitTyp(); } return; }
  if(b.id==='notype'){
    S.typing=false; save();
    for(var k=L.i;k<L.steps.length;k++){ var sk=L.steps[k]; if(sk.t==='q'&&sk.type==='typ') sk.type=plainType(sk.item); }
    renderStep(); return;
  }
  if(b.hasAttribute('data-typing')){ S.typing=(b.getAttribute('data-typing')==='1'); save(); renderHome(); renderSettings(); return; }
  if(b.id==='go'||b.id==='again'){ startLesson(); return; }
  if(b.id==='go-p'||b.id==='again-p'){ startPhraseLesson(); return; }
  if(b.id==='to-phr'){ renderPhr(); show('phr'); return; }
  if(b.id==='cont'){ if(L) next(); return; }
  if(b.id==='to-words'){ renderWords(); show('words'); return; }
  if(b.id==='quit'||b.id==='home-btn'){
    if(b.id==='quit'&&L&&L.mode==='phr'){ renderPhr(); show('phr'); } else { renderHome(); show('home'); }
    return;
  }
  if(b.id==='reset'){
    $('resetBox').innerHTML='<p style="margin:0 0 10px">Cancella serie, punti e tutti i caratteri imparati?</p><div class="row"><button type="button" class="btn small danger ghost" id="reset-yes">Sì, cancella</button><button type="button" class="btn small ghost" id="reset-no">Annulla</button></div>';
    return;
  }
  if(b.id==='reset-no'){ renderSettings(); return; }
  if(b.id==='reset-yes'){ S=defaults(); save(); renderHome(); renderLib(); renderWords(); renderPhr(); renderSettings(); renderN5Menu(); renderChips(); return; }
});
document.addEventListener('keydown',function(e){
  var onBtn=e.target&&e.target.tagName==='BUTTON';
  if(view==='rev'&&R){
    if(!R.flip&&!onBtn&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); flipCard(); }
    else if(R.flip&&e.key>='1'&&e.key<='4'){ rateCard(parseInt(e.key,10)-1); }
    return;
  }
  if(view==='n5'&&N5&&N5.on){
    if(!N5.locked&&e.key>='1'&&e.key<='4'){ n5Pick(parseInt(e.key,10)-1); }
    else if(N5.locked&&e.key==='Enter'&&!onBtn){ e.preventDefault(); n5Next(); }
    return;
  }
  if(view==='part'&&PQ&&PQ.on){
    if(!PQ.locked&&e.key>='1'&&e.key<='4'){ pqPick(parseInt(e.key,10)-1); }
    else if(PQ.locked&&e.key==='Enter'&&!onBtn){ e.preventDefault(); pqNext(); }
    return;
  }
  if(view!=='lesson'||!L||!L.cur) return;
  if(e.key>='1'&&e.key<='4'&&!L.cur.intro&&L.cur.opts){ pick(parseInt(e.key,10)-1); return; }
  if(e.key==='Enter'&&!(e.target&&e.target.tagName==='BUTTON')){
    if(L.cur.typ&&!L.cur.locked){ e.preventDefault(); submitTyp(); return; }
    if(L.cur.bld&&!L.cur.locked){ e.preventDefault(); checkBld(); return; }
    if(L.cur.intro||L.cur.locked){ e.preventDefault(); next(); }
  }
});

document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='tin'){ var c=$('chk'); if(c) c.disabled=!(e.target.value&&e.target.value.trim()); }
});
try{ $('hdrM').innerHTML=mascot('idle'); }catch(e){}
renderHome(); renderWords(); renderPhr(); renderLib(); renderSettings(); renderN5Menu(); show('home');
})();
</script>
